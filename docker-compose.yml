services:
  postgres:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: interview_ledger
      POSTGRES_USER: ledger_demo
      POSTGRES_PASSWORD: ledger_demo
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_demo -d interview_ledger"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - ledger-demo:/var/lib/postgresql/data
volumes:
  ledger-demo:
