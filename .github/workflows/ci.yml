name: Baseline build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: H2 baseline and executable jar
        run: ./gradlew --no-daemon clean test bootJar
      - name: Compile public exercise checks without running intentional failures
        run: ./gradlew --no-daemon exerciseTestClasses
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-test-reports
          path: build/reports/tests/
  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: PostgreSQL baseline with Testcontainers
        run: ./gradlew --no-daemon postgresTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-test-reports
          path: build/reports/tests/postgresTest/
